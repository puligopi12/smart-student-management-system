spring.application.name=student-management-backend
server.port=8080

# ===================================================================
# Database Connection (MySQL 8.0+)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:newpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# Security & JWT Configuration
# ===================================================================
# 256-bit Hex secret key for HS256/HS384
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours = 86400000 ms
app.jwt.expiration-ms=86400000

# ===================================================================
# AI Search Assistant Configuration
# Configurable: 'gemini', 'openai', or 'heuristic-nlp'
# If AI_API_KEY is empty, the system automatically uses the internal NLP engine
# ===================================================================
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-1.5-flash}
app.ai.timeout-ms=8000

# Jackson formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
